services:
  saa-db:
    image: postgres:16-alpine
    container_name: saa-db
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-saa}
    volumes:
      - saa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saa}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saa-network

  saa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saa-backend
    restart: unless-stopped
    ports:
      - '8096:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@saa-db:5432/${POSTGRES_DB:-saa}?schema=public
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      FIREBASE_DEV_BYPASS: ${FIREBASE_DEV_BYPASS:-true}
    volumes:
      - saa-uploads:/app/uploads
    depends_on:
      saa-db:
        condition: service_healthy
    networks:
      - saa-network

volumes:
  saa-pgdata:
    name: saa-pgdata
  saa-uploads:
    name: saa-uploads

networks:
  saa-network:
    name: saa-network
    driver: bridge
